<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Веденеева П.И.</title>
    <link href="../styles/style.css" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-inner">
                <div class="logo">
                    <span class="logo-icon">❤︎</span>
                    <h1>Веденеева П.И.</h1>
                    <span class="logo-icon">❤︎</span>
                </div>
                <p class="tagline">всё, и ничего</p>
            </div>
        </div>
    </header>

    <nav class="main-nav">
        <div class="container">
            <ul class="nav-list">
                <li><a href="../index.html">Главная</a></li>
                <li><a href="news.html">Новости</a></li>
                <li><a href="personal.html">Обо мне</a></li>
                <li><a href="work.html">Мои работы</a></li>
                <li><a href="login.html">Авторизация</a></li>
                <li><a href="register.html">Регистрация</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="register-section">
            <div class="register-card">
                <h2>Регистрация</h2>
                <form class="register-form">
                    <div class="form-row">
                        <label for="fam">Фамилия</label>
                        <input type="text" id="fam" name="fam" placeholder="Введите фамилию" required>
                    </div>
                    <div class="form-row">
                        <label for="name">Имя</label>
                        <input type="text" id="name" name="name" placeholder="Введите имя" required>
                    </div>
                    <div class="form-row">
                        <label for="otch">Отчество</label>
                        <input type="text" id="otch" name="otch" placeholder="Введите отчество">
                    </div>
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
                    </div>
                    <div class="form-row">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" placeholder="Придумайте пароль" required>
                    </div>
                    <div class="form-row">
                        <label for="confirm">Подтверждение пароля</label>
                        <input type="password" id="confirm" name="confirm" placeholder="Повторите пароль" required>
                    </div>
                    <div class="form-row">
                        <label for="birth">Дата рождения</label>
                        <input type="date" id="birth" name="birth">
                    </div>

                    <div class="form-row radio-group">
                        <label>Размер одежды</label>
                        <div class="radio-options">
                            <label><input type="radio" name="size" value="xl"> XL</label>
                            <label><input type="radio" name="size" value="l"> L</label>
                            <label><input type="radio" name="size" value="m"> M</label>
                            <label><input type="radio" name="size" value="s"> S</label>
                        </div>
                    </div>

                    <div class="form-row checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="consent" required>
                            Согласие на обработку персональных данных
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">Зарегистрироваться</button>
                </form>
                <div class="register-footer">
                    <a href="login.html">Уже есть аккаунт? Войти</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>© Веденеева П.И. | Все права защищены</p>
        </div>
    </footer>

</body>
</html>

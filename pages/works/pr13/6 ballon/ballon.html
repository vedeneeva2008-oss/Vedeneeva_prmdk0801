<!doctype html>
<html>
	<head>
		<meta charset = "utf-8">
		<title>svg</title>
		<style>
			svg {
			  border: 1px solid #dddddd;
			}
		</style>
	</head>
	<body>
	<svg width="360" height="500">
		<rect width="320" height="460" x="20" y="20" rx="20" fill="lemonchiffon"/>
		<circle r="100" cx="150" cy="170" fill="crimson"/>
		<ellipse cx="240" cy="210" rx="65" ry="90" fill="gold"/>
		<polygon points="140,280 150,270 160,280" fill="crimson"/>
		<polygon points="230,310 240,300 250,310" fill="gold"/>
		<polyline points="150,280 160,300 140,330, 160,360 140,380 160,420" stroke="brown" fill="lemonchiffon"/>
		<polyline points="240,310 250,330 230,350, 250,380 230,400 250,440" stroke="brown" fill="lemonchiffon"/>
	</svg>
	</body>
</html>
